spring.application.name=data-compress-control-system-v5
server.port=8080
server.address=0.0.0.0
spring.servlet.multipart.max-file-size=768MB
spring.servlet.multipart.max-request-size=800MB
server.tomcat.max-part-count=350
server.error.include-message=always

management.endpoints.web.exposure.include=health,info,metrics

app.transfer.max-file-bytes=805306368
app.transfer.default-chunk-bytes=262144
app.transfer.worker-count=1
app.transfer.max-retries=3
app.transfer.simulation-delay-cap-ms=5000

app.network.sample-period-ms=500
app.network.history-limit=7200
app.network.simulation-enabled=true
app.network.measurement-stale-after-ms=10000
app.network.minimum-fallback-rate-kbps=32

# Completed task metadata and downloadable archives are saved here so different clients can share history.
app.history.dir=data/history

app.predictor.horizon=12
app.predictor.history-samples=7200
app.predictor.timeout-ms=100
app.predictor.feedback-alpha=0.18
app.predictor.minimum-safe-factor=0.55
app.predictor.maximum-safe-factor=1.05
app.predictor.maximum-safe-step-up=1.15
app.predictor.health-window-samples=240
app.predictor.health-minimum-samples=30
app.predictor.health-maximum-mape-percent=35
app.predictor.health-maximum-unsafe-ratio=0.35
app.predictor.health-cooldown-ms=60000

app.strategy.profile-sample-bytes=65536
app.strategy.switch-gain-percent=3.0
app.strategy.minimum-hold-ms=1000

logging.level.com.datacompress.control=INFO


