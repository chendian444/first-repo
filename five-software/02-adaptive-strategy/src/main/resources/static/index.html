<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自适应数据压缩策略分析与优化软件</title><link rel="stylesheet" href="app.css"></head>
<body><header><div class="brand">DC <span>STRATEGY / 策略实验室</span></div><span class="badge">独立应用 · v1.0</span></header><main><div class="heading"><p class="eyebrow">DATA COMPRESS / STRATEGY</p><h1>自适应数据压缩策略分析与优化软件</h1><p class="muted">功能独立 · 本地运行 · 无跨项目启动依赖</p></div><div id="notice" role="status" aria-live="polite"></div><section class="grid"><article><h2>1. 获取压缩性能画像</h2><p class="muted">本地独立实测 NONE / DEFLATE 1、6、9 级；也可导入算法库导出的多算法画像，不需要算法库在线。</p><form id="measureForm"><input id="sample" type="file" required><button>实测样本</button></form><label>导入画像 JSON<input id="profileFile" type="file" accept=".json"></label><textarea id="profiles" rows="10" spellcheck="false" aria-label="压缩画像 JSON"></textarea>
<h2>2. 场景参数</h2><form id="analysisForm"><label>规划字节数<input id="bytes" type="number" min="1" max="67108864" value="262144" required></label><label>安全速率 KiB/s<input id="safeRate" type="number" min="0.01" step="any" value="1200" required></label><label>丢包 %<input id="loss" type="number" min="0" max="100" step="any" value="0"></label><label>网络质量<select id="quality"><option>GOOD</option><option>FLUCTUATING</option><option>RECOVERING</option><option>CONGESTED</option><option>DISCONNECTED</option></select></label><label>优先级<select id="priority"><option>NORMAL</option><option>IMPORTANT</option><option>CRITICAL</option></select></label><label>当前策略保持 ms<input id="held" type="number" min="0" value="2000"></label><label><input id="compressed" type="checkbox">已压缩数据</label><button>分析并优化</button><button type="button" id="reset">清除当前策略</button></form></article>
<article><h2>推荐策略</h2><div id="recommendation" class="empty">上传样本或导入画像后开始分析</div><h2>候选总耗时比较</h2><div id="ranking"></div><p class="muted">总耗时为模型估算，包含压缩、传输、解压、排队和重传。不是实际发送记录。</p><button id="export" disabled>导出分析报告</button></article></section></main><footer>自适应数据压缩策略分析与优化软件 · 数据保留策略与接口详见项目 README</footer><script src="app.js"></script></body></html>
