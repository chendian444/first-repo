<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基于时序特征的网络传输速率智能预测软件</title><link rel="stylesheet" href="app.css"></head>
<body><header><div class="brand">DC <span>FORECAST / 时序预测</span></div><span class="badge">独立应用 · v1.0</span></header><main><div class="heading"><p class="eyebrow">DATA COMPRESS / PREDICTION</p><h1>基于时序特征的网络传输速率智能预测软件</h1><p class="muted">功能独立 · 本地运行 · 无跨项目启动依赖</p></div><div id="notice" role="status" aria-live="polite"></div><section class="grid"><article><h2>输入时序速率</h2><p class="muted">按时间先后输入 KiB/s，逗号或空白分隔。模型保留原系统权重；样本不足时显示回退原因。</p><form id="predictForm"><textarea id="series" rows="12" aria-label="时序样本" placeholder="例如：1200, 1180, 1250, 1210" required></textarea><label>导入单列 CSV / TXT<input id="seriesFile" type="file" accept=".csv,.txt"></label><label>丢包 %<input id="loss" type="number" min="0" max="100" value="0" step="any"></label><label>抖动 ms<input id="jitter" type="number" min="0" value="5" step="any"></label><button>运行预测</button><button type="button" id="example">载入演示样本</button></form><p id="inputLabel" class="muted"></p>
<h2>实际值反馈</h2><form id="feedbackForm"><label>先前预测<input id="predicted" type="number" min="0.01" step="any" required></label><label>对应实际值<input id="actual" type="number" min="0.01" step="any" required></label><button>更新反馈校正</button></form><div id="health"></div></article>
<article><h2>历史与未来速率</h2><canvas id="forecast" width="800" height="380"></canvas><section class="stats" id="metrics"></section><div id="model" class="empty">等待输入</div><button id="export" disabled>导出预测 JSON</button><p class="muted">绿色为未来预测，蓝色为输入历史；安全速率是保守预算。当前模型准确度需要你的实际数据评估。</p></article></section></main><footer>基于时序特征的网络传输速率智能预测软件 · 数据保留策略与接口详见项目 README</footer><script src="app.js"></script></body></html>
