<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AIoT设备通信与弱网自动化测试平台</title><link rel="stylesheet" href="/style.css"><body>
<header><small>WHEEL LAB / 通信质量工程</small><h1>AIoT设备通信与弱网自动化测试平台</h1><p>真实串口接入 · 电脑压缩 · 持久化重试 · 可复现测试</p></header>
<main><section><label>管理员令牌 <input id="token" type="password" autocomplete="off" placeholder="从本机 admin-token.txt 读取"></label><button id="connect">连接平台</button><span id="message" role="status">等待连接</span></section>
<div class="grid"><section><h2>设备接入</h2><p>在线表示网关可达；实际遥测新鲜度单独显示。</p><label>设备标识 <input id="deviceId" value="wheel-001" maxlength="80"></label><label>设备名称 <input id="deviceName" value="动量轮实验设备" maxlength="100"></label><button id="register">注册设备</button><pre id="credential"></pre><label>查看设备 <select id="devices"></select></label><div id="deviceStatus"></div><button id="export">导出遥测 CSV</button></section>
<section><h2>弱网自动化测试</h2><p>在独立测试设备上回放合成输入，不操作真实电机。故障注入位于应用 HTTP 层。</p><select id="profile"><option value="all">全部六种场景</option><option value="baseline">正常链路</option><option value="latency">延迟与抖动</option><option value="loss">请求丢失</option><option value="ack_loss">应答丢失与去重</option><option value="disconnect">断网后恢复</option><option value="bandwidth">带宽限制</option></select><button id="run">运行测试</button><button id="report">下载报告</button><div id="runs"></div></section></div>
<section><h2>实时遥测</h2><label>趋势通道 <select id="channel"></select></label><canvas id="chart" width="1000" height="180"></canvas><p id="sampleInfo"></p><div id="telemetry" class="values"></div></section>
<section><h2>异常检测与结果分析</h2><p>无监督在线统计基线：每会话、每协议、每通道预热 30 点，超过 6σ 提示异常；另检验非有限值与保护标志。提示不等于硬件故障诊断，不自动控制电机。</p><div id="alerts"></div></section></main><script src="/app.js"></script></body></html>
