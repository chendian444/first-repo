<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cubli 遥控调试终端</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <h1>Cubli 遥控调试终端</h1>
    <span class="tag">WiFi · UDP · JSON</span>
  </div>
  <div class="pills">
    <span class="pill" id="pillStream">STREAM 停</span>
    <span class="pill" id="pillAck">ACK 无</span>
    <span class="pill" id="pillErr">ERR 无</span>
  </div>
</header>

<main class="grid">

  <!-- 左：控制区 -->
  <section class="card">
    <div class="card-head">
      <h2>控制</h2>
      <div class="head-actions">
        <button id="btnStream" class="btn btn-primary">启动发送</button>
        <button id="btnReset" class="btn">回中</button>
      </div>
    </div>

    <div class="axis-list">
      <div class="axis" data-axis="wx">
        <div class="axis-label">
          <span>X 轴角速度 <code>wx</code></span>
          <output class="axis-val" id="outX">0.0</output>
        </div>
        <input type="range" class="slider" id="sldX" min="-300" max="300" step="1" value="0" />
      </div>

      <div class="axis" data-axis="wy">
        <div class="axis-label">
          <span>Y 轴角速度 <code>wy</code></span>
          <output class="axis-val" id="outY">0.0</output>
        </div>
        <input type="range" class="slider" id="sldY" min="-300" max="300" step="1" value="0" />
      </div>

      <div class="axis" data-axis="wz">
        <div class="axis-label">
          <span>Z 轴角速度 <code>wz</code></span>
          <output class="axis-val" id="outZ">0.0</output>
        </div>
        <input type="range" class="slider" id="sldZ" min="-300" max="300" step="1" value="0" />
      </div>
    </div>

    <p class="hint">
      键盘：<kbd>A</kbd><kbd>D</kbd> 控 X，<kbd>W</kbd><kbd>S</kbd> 控 Y，<kbd>Q</kbd><kbd>E</kbd> 控 Z，
      <kbd>Space</kbd> 停机，<kbd>Esc</kbd> 回中
    </p>

    <hr class="sep" />

    <div class="btn-grid">
      <button class="btn cmd" data-cmd="edge_auto">棱平衡 · 自动</button>
      <button class="btn cmd" data-cmd="dot_auto">点平衡 · 自动</button>
      <button class="btn cmd" data-cmd="manual_edge">A 键 · 棱手动</button>
      <button class="btn cmd" data-cmd="manual_dot">B 键 · 点手动</button>
      <button class="btn cmd warn" data-cmd="stop">ZR · 停机</button>
      <button class="btn cmd danger" data-cmd="power_off">ZL · 断电</button>
    </div>
  </section>

  <!-- 右：状态/调试 -->
  <section class="card">
    <div class="card-head">
      <h2>链路状态</h2>
      <button id="btnPing" class="btn">Ping ESP32</button>
    </div>

    <div class="kv">
      <div><span>目标地址</span><b id="kvAddr">—</b></div>
      <div><span>已发送</span><b id="kvSent">0</b></div>
      <div><span>ACK 数</span><b id="kvAcks">0</b></div>
      <div><span>距最近 ACK</span><b id="kvLat">—</b></div>
      <div><span>包序号</span><b id="kvSeq">0</b></div>
    </div>

    <div class="cfg-row">
      <label>ESP32 IP
        <input id="inIp" type="text" value="192.168.0.9" />
      </label>
      <label>端口
        <input id="inPort" type="number" value="8888" min="1" max="65535" />
      </label>
      <label>频率
        <input id="inHz" type="number" value="50" min="1" max="100" />
      </label>
      <button id="btnApply" class="btn btn-primary">应用</button>
    </div>

    <div class="raw-row">
      <label class="switch">
        <input type="checkbox" id="chkRaw" />
        <span>直通模式（ch0/ch1/ch2 原始值 0-255）</span>
      </label>
      <div class="raw-sliders" id="rawBox" hidden>
        <label>ch0 <input type="range" id="rCh0" min="0" max="255" value="128"><output id="oCh0">128</output></label>
        <label>ch1 <input type="range" id="rCh1" min="0" max="255" value="128"><output id="oCh1">128</output></label>
        <label>ch2 <input type="range" id="rCh2" min="0" max="255" value="128"><output id="oCh2">128</output></label>
      </div>
    </div>

    <h3 class="sub">日志</h3>
    <pre class="log" id="logBox"></pre>
  </section>

</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
